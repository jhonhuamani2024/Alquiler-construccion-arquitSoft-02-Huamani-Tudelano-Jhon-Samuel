services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${DB_USER:-alquiler}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambiar_esta_clave}
      POSTGRES_DB: ${DB_NAME:-alquiler_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
